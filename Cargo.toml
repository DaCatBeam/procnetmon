[package]
name = "procnetmon"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive", "cargo"] }
color-eyre = "0.6.5"
crossterm = "0.29.0"
mutants = "0.0.4"
ratatui = "0.30.2"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
indoc = "2.0.8"
rstest = "0.28.0"

[[example]]
name = "demo_traffic"
# Its tests check that the app can read what it writes, so cargo test runs them.
test = true
